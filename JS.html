<script>
    // ១. ចលនាបង្ហាញដំបូងពេល Load Page
    gsap.from(".logo, nav, .cart-icon", {
      y: -30,
      opacity: 0,
      duration: 1,
      stagger: 0.1,
      ease: "power2.out"
    });

    gsap.from(".title, .subtitle, .hero-buttons", {
      x: -50,
      opacity: 0,
      duration: 1.2,
      delay: 0.3,
      stagger: 0.2,
      ease: "power3.out"
    });

    gsap.from(".coffee-glass", {
      scale: 0.8,
      opacity: 0,
      duration: 1.5,
      delay: 0.5,
      ease: "back.out(1.7)"
    });

    // ២. ចលនាអណ្តែតចុះឡើង (Floating Effects)
    gsap.to(".main-floating", {
      y: 15,
      repeat: -1,
      yoyo: true,
      duration: 2.5,
      ease: "sine.inOut"
    });

    gsap.to(".bean-1", {
      y: -20,
      rotation: 45,
      repeat: -1,
      yoyo: true,
      duration: 3,
      ease: "sine.inOut"
    });

    gsap.to(".bean-2", {
      y: 20,
      rotation: -30,
      repeat: -1,
      yoyo: true,
      duration: 2.2,
      ease: "sine.inOut"
    });

    gsap.to(".bean-3", {
      y: -15,
      rotation: 60,
      repeat: -1,
      yoyo: true,
      duration: 2.8,
      ease: "sine.inOut"
    });
  </script>
